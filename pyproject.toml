[project]
name = "mcp-server-kalshi"
version = "0.2.3"
description = "An MCP server implementation for Kalshi prediction market endpoints"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "mcp>=1.28.1,<2",
    "httpx",
    "cryptography>=49.0.0",
    "pypdf",
    "pydantic == 2.12.0",
    "pydantic-settings == 2.11.0",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pre-commit",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the PEP 561 marker so downstream consumers get our type hints.
mcp_server_kalshi = ["py.typed"]

[project.scripts]
start = "mcp_server_kalshi.server:main"
mcp-server-kalshi = "mcp_server_kalshi.server:main"
test = "pytest:main"
format = "black:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: import sorting, UP: pyupgrade, B: bugbear.
select = ["E", "F", "I", "UP", "B"]
# Line length is owned by black; the long tool-description strings are intentional.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/mcp_server_kalshi"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
# Lenient to start (the code is annotated but not exhaustively); tighten over time.
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["mcp_server_kalshi"]
branch = true
